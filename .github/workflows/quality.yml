name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Check formatting
        run: ruff format --check src tests
      - name: Test
        run: pytest

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Audit dependencies
        run: pip-audit

  container-smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned image
        run: docker build --tag sentiment-demo:test .
      - name: Train smoke-test artifact
        run: |
          mkdir --parents "${{ runner.temp }}/sentiment-artifacts"
          docker run --rm --entrypoint sentiment-train \
            --user "$(id -u):$(id -g)" \
            --volume "${{ github.workspace }}/tests/fixtures:/fixtures:ro" \
            --volume "${{ runner.temp }}/sentiment-artifacts:/output" \
            sentiment-demo:test \
            --data /fixtures/container_smoke.csv \
            --model-output /output/sentiment_model.joblib \
            --metrics-output /output/metrics.json \
            --holdout-folds 2 --cv-folds 2 --max-features 100 --jobs 1
      - name: Start hardened demo container
        run: |
          docker run --detach --name sentiment-demo \
            --publish 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp:size=16m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --volume "${{ runner.temp }}/sentiment-artifacts/sentiment_model.joblib:/app/artifacts/sentiment_model.joblib:ro" \
            sentiment-demo:test
      - name: Verify health and inference
        run: |
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/healthz
          curl --fail --request POST http://127.0.0.1:8000/api/predict \
            --header "Content-Type: application/json" \
            --data '{"entity":"ExampleEntity","text":"excellent delightful amazing"}' \
            | grep 'Positive'
      - name: Show logs and remove container
        if: always()
        run: |
          docker logs sentiment-demo || true
          docker rm --force sentiment-demo || true
