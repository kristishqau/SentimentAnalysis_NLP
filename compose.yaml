services:
  demo:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ./artifacts/sentiment_model.joblib
        target: /app/artifacts/sentiment_model.joblib
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
