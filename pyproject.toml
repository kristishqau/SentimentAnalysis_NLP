[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analysis-nlp"
version = "1.0.0"
description = "Leakage-aware, reproducible multiclass sentiment analysis for entity-focused tweets."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kristi Shqau" }]
keywords = ["nlp", "sentiment-analysis", "scikit-learn", "machine-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "joblib>=1.3,<2",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29,<7",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
]
dev = [
  "build>=1.2,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]
transformer = [
  "accelerate>=1,<2",
  "datasets>=5.0.1,<6",
  "protobuf>=5,<7",
  "sentencepiece>=0.2,<1",
  "torch>=2.2,<3",
  "transformers>=5,<6",
]

[project.scripts]
sentiment-train = "sentiment_analysis.cli:train_command"
sentiment-predict = "sentiment_analysis.cli:predict_command"
sentiment-benchmark = "sentiment_analysis.benchmark_cli:benchmark_command"
sentiment-analyze = "sentiment_analysis.analysis_cli:analysis_command"
sentiment-demo = "sentiment_analysis.demo:demo_command"
sentiment-transformer-benchmark = "sentiment_analysis.transformer:transformer_command"
sentiment-transformer-analyze = "sentiment_analysis.transformer_analysis:transformer_analysis_command"
sentiment-transformer-study = "sentiment_analysis.transformer_study:transformer_study_command"
sentiment-transformer-study-merge = "sentiment_analysis.transformer_study:transformer_study_merge_command"

[project.urls]
Repository = "https://github.com/kristishqau/SentimentAnalysis_NLP"
Issues = "https://github.com/kristishqau/SentimentAnalysis_NLP/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --basetemp=.pytest-tmp --cov=sentiment_analysis --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = [
  "src/sentiment_analysis/transformer.py",
  "src/sentiment_analysis/transformer_study.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
